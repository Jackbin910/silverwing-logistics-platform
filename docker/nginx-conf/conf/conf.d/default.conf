# Docker 内置 DNS，运行时解析上游（启动时不校验，微服务未起时返回 502）
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen       80;
    server_name  localhost;
    client_max_body_size 50m;

    # 前端静态产物（bind mount 进容器，见 onepanel-infra-compose.yml 的 nginx 卷）
    root /data/www/silverwing;
    index index.html;

    # 健康检查端点（nginx 自身可用性，不依赖上游）
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # 统一入口：所有请求转发到 Gateway 8080
    # Gateway 路由规则: /auth/**, /core/**, /twin/**, /ai/**, /ops/**, /integration/**, /admin/**
    set $gateway_upstream silverwing-gateway:8080;

    # SSE 流式接口专用规则：仅这三个路径关闭响应缓冲、放长读超时
    # 正则 location 优先级高于前缀 location /api/，命中后不再走下面的普通 API 规则
    # 对应 Gateway 去掉 /ai 前缀后的 /chat/stream、/chat/agent/stream、/knowledge/qa/stream
    location ~ ^/api/ai/(chat/stream|chat/agent/stream|knowledge/qa/stream)$ {
        # 接入层防护：先 WAF 后限流（不触碰鉴权，鉴权仍在 Gateway 层）
        access_by_lua_block {
            require("waf").check()
            require("limit").check()
        }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$gateway_upstream;
        proxy_request_buffering off;
        # SSE 必须关闭响应缓冲：否则 token 被攒批下发，且客户端断开信号无法及时回传，
        # 后端收不到取消信号，模型会继续生成直至结束，白占 GPU
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/ 前缀请求：去掉前缀后转发到 gateway
    # 例如 /api/auth/login → gateway 收到 /auth/login → 路由到 silverwing-auth
    # 普通接口保持 nginx 默认的响应缓冲与 60s 读超时，不受 SSE 长连接配置影响
    location /api/ {
        # 接入层防护：先 WAF 后限流（不触碰鉴权，鉴权仍在 Gateway 层）
        access_by_lua_block {
            require("waf").check()
            require("limit").check()
        }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$gateway_upstream;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端静态资源 + 其余网关路由：
    #   存在的静态文件（index.html / assets/...）直接返回
    #   未命中（如 /admin/** /auth/** 等后端路由）转发网关，保留原 location / 透传行为
    location / {
        try_files $uri $uri/ @gateway;
    }

    location @gateway {
        # 接入层防护：先 WAF 后限流（不触碰鉴权，鉴权仍在 Gateway 层）
        access_by_lua_block {
            require("waf").check()
            require("limit").check()
        }
        proxy_pass http://$gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
